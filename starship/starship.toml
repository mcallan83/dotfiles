command_timeout = 1000

[directory]
style = "blue"

[docker_context]
disabled = true

[git_branch]
symbol = ""
format="on [$symbol$branch]($style)"
style = "yellow"

[git_commit]
format = ' [\($hash$tag\)]($style)'
style = "cyan"
only_detached = false

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold 196"

[gcloud]
disabled = true

[lua]
disabled = true

[nodejs]
style = "bold green"
format = "[JS$version]($style) "
version_format = 'v${major}'

[php]
format = "[PHP$version]($style) "
version_format = 'v${major}.${minor}'

[username]
style_user = "purple bold"
